version: '3.8'

services:
  nexus-db:
    image: postgres:15-alpine
    container_name: nexus-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - nexus_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: nexus-redis
    ports:
      - '6379:6379'
    volumes:
      - nexus_redis_data:/data

volumes:
  nexus_data:
  nexus_redis_data:
