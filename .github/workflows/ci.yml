name: CI - E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: nexus_user
      DB_PASSWORD: nexus_test_password
      DB_NAME: nexus_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MP_ACCESS_TOKEN: TEST-0000000000000000-000000-00000000000000000000000000000000-000000000
      MP_WEBHOOK_SECRET: test_webhook_secret_key

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_test_password
          POSTGRES_DB: nexus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_user -d nexus_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test file
        run: |
          cat << 'EOF' > .env.test
          NODE_ENV=${{ env.NODE_ENV }}
          DB_HOST=${{ env.DB_HOST }}
          DB_PORT=${{ env.DB_PORT }}
          DB_USERNAME=${{ env.DB_USERNAME }}
          DB_PASSWORD=${{ env.DB_PASSWORD }}
          DB_NAME=${{ env.DB_NAME }}
          REDIS_HOST=${{ env.REDIS_HOST }}
          REDIS_PORT=${{ env.REDIS_PORT }}
          MP_ACCESS_TOKEN=${{ env.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET=${{ env.MP_WEBHOOK_SECRET }}
          EOF

      - name: Run database migrations
        run: npm run migration:run

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
